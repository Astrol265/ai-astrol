<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04112b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI Astrol">
<link rel="manifest" href="/manifest.webmanifest">
<title>AI Astrol</title>
<style>
*{box-sizing:border-box}
:root{--bg:#020815;--panel:#071b3b;--panel2:#0b2854;--line:#214d80;--blue:#168cff;--cyan:#64ddff;--txt:#eff8ff;--muted:#8da9cb}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -8%,#123f82 0,#061733 36%,#020711 78%);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}
body{min-height:100dvh}.app{min-height:100dvh;max-width:720px;margin:auto}
header{height:78px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;background:rgba(2,10,28,.82);backdrop-filter:blur(20px);border-bottom:1px solid #163a66;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:21px}.orb{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 32% 28%,#baf2ff,#2398ff 45%,#092b67 76%);box-shadow:0 0 25px #168cff99}
.actions{display:flex;gap:8px}.icon{border:0;color:#d9edff;background:#ffffff0b;border:1px solid #18365d;border-radius:13px;width:42px;height:42px;font-size:18px}
main{padding:20px 15px 150px}.welcome{text-align:center;padding:14px 5px 28px}.welcome h1{font-size:34px;line-height:1.16;margin:0 0 8px}.welcome p{margin:0;color:var(--muted)}
.chat{display:flex;flex-direction:column;gap:12px}.msg{max-width:91%;padding:13px 15px;border-radius:19px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.user{align-self:flex-end;background:linear-gradient(135deg,#0d67d5,#178fff);border-bottom-right-radius:5px}.assistant{align-self:flex-start;background:rgba(8,27,57,.94);border:1px solid var(--line);border-bottom-left-radius:5px}.time{font-size:10px;color:#7898bd;margin-top:5px}
.composer{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(720px,100%);padding:9px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(1,7,19,.97) 23%);z-index:10}.status{text-align:center;height:22px;color:#7bcfff;font-size:12px}
.bar{display:flex;gap:7px;align-items:flex-end;background:#071a38;border:1px solid #285584;border-radius:27px;padding:7px;box-shadow:0 12px 35px #0009}.bar textarea{flex:1;min-width:0;max-height:120px;resize:none;border:0;outline:0;background:transparent;color:white;padding:10px 8px;font:16px -apple-system,BlinkMacSystemFont,Arial}.btn{flex:0 0 46px;width:46px;height:46px;border:0;border-radius:50%;font-size:19px;color:#fff}.mic{background:#0c3567}.mic.recording{background:#ff315d;box-shadow:0 0 0 7px #ff315d24,0 0 30px #ff315d77;animation:pulse 1s infinite}@keyframes pulse{50%{transform:scale(1.06)}}.send{background:#168cff}.hint{text-align:center;color:#58779f;font-size:10px;padding-top:7px}
.wake{display:flex;align-items:center;gap:7px;justify-content:center;margin:7px auto 0;color:#6686ad;font-size:11px}.wake input{accent-color:#168cff}
.typing{display:inline-flex;gap:4px}.typing i{width:7px;height:7px;border-radius:50%;background:#65cfff;animation:d .8s infinite}.typing i:nth-child(2){animation-delay:.12s}.typing i:nth-child(3){animation-delay:.24s}@keyframes d{50%{opacity:.2;transform:translateY(-3px)}}
.toast{position:fixed;top:88px;left:50%;transform:translateX(-50%);background:#0b2851;border:1px solid #2c5e91;padding:10px 14px;border-radius:14px;font-size:12px;display:none;z-index:20;box-shadow:0 8px 25px #0008}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><div class="orb"></div>AI Astrol</div>
  <div class="actions"><button class="icon" id="stop" title="Stop voice">◼</button><button class="icon" id="clear" title="Clear">⌫</button></div>
</header>
<main>
  <section class="welcome"><h1 id="greeting"></h1><p>Your personal AI assistant 🌌</p></section>
  <section class="chat" id="chat"></section>
</main>
<div class="composer">
  <div class="status" id="status"></div>
  <div class="bar">
    <textarea id="input" rows="1" placeholder="Ask Astrol anything…"></textarea>
    <button class="btn mic" id="mic" aria-label="Speak">🎙️</button>
    <button class="btn send" id="send" aria-label="Send">➤</button>
  </div>
  <label class="wake"><input type="checkbox" id="wake"> Keep “Hey Astro” listening while Astrol is open</label>
  <div class="hint">Voice questions are answered with text + voice. Typed questions stay text-only.</div>
</div>
<div class="toast" id="toast"></div>
</div>
<script>
const greetings=[
"Hey! 👋 Astrol is here. What are we getting into today?",
"Welcome back! 🌌 What can I help you with?",
"Astrol online. 🚀 Ask me anything.",
"Hey there! 🔵 What should we work on today?",
"Ready when you are. ✨ Talk to Astrol."
];
document.getElementById("greeting").textContent=greetings[Math.floor(Math.random()*greetings.length)];

const chat=document.getElementById("chat"), input=document.getElementById("input"), mic=document.getElementById("mic"), send=document.getElementById("send"), status=document.getElementById("status"), toast=document.getElementById("toast"), wake=document.getElementById("wake");
let history=JSON.parse(localStorage.getItem("astrol_history_v3")||"[]");
let mediaRecorder=null,chunks=[],recording=false,wakeRecognition=null,wakeActive=false;

function save(){localStorage.setItem("astrol_history_v3",JSON.stringify(history.slice(-30)))}
function add(role,text,saveIt=true){
 const el=document.createElement("div");el.className="msg "+role;el.textContent=text;chat.appendChild(el);
 if(saveIt){history.push({role:role==="assistant"?"assistant":"user",content:text});save()}
 window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});return el;
}
function render(){chat.innerHTML="";history.forEach(m=>add(m.role,m.content,false))}
render();

function toastMsg(s){toast.textContent=s;toast.style.display="block";setTimeout(()=>toast.style.display="none",2500)}
function resize(){input.style.height="auto";input.style.height=Math.min(input.scrollHeight,120)+"px"}input.addEventListener("input",resize);
document.getElementById("clear").onclick=()=>{history=[];save();chat.innerHTML=""};
document.getElementById("stop").onclick=()=>{speechSynthesis?.cancel();status.textContent=""};

async function ask(text,spoken=false){
 text=text.trim();if(!text)return;
 add("user",text);input.value="";resize();status.textContent="Astrol is thinking…";
 const loading=add("assistant","",false);loading.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';
 try{
  const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:text,history})});
  const data=await r.json();if(!r.ok)throw new Error(data.error||"AI request failed");
  loading.remove();add("assistant",data.reply);status.textContent="";
  if(spoken)await playVoice(data.reply);
 }catch(e){loading.remove();add("assistant","I couldn't connect to Astrol's online AI service. Please check the internet connection and server setup.");status.textContent="";console.error(e)}
}

async function playVoice(text){
 try{
  status.textContent="Astrol is speaking…";
  const r=await fetch("/api/tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text})});
  if(!r.ok)throw new Error("TTS failed");
  const blob=await r.blob(),url=URL.createObjectURL(blob),audio=new Audio(url);
  audio.onended=()=>{URL.revokeObjectURL(url);status.textContent=""};await audio.play();
 }catch(e){
  status.textContent="";
  if("speechSynthesis" in window){const u=new SpeechSynthesisUtterance(text);speechSynthesis.cancel();speechSynthesis.speak(u)}
 }
}

function preferredMime(){
 const choices=["audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus"];
 return choices.find(x=>MediaRecorder.isTypeSupported(x))||"";
}

async function startRecording(){
 if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toastMsg("This iPhone browser does not support audio recording.");return}
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  chunks=[];const mime=preferredMime();mediaRecorder=new MediaRecorder(stream,mime?{mimeType:mime}:{});
  mediaRecorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  mediaRecorder.onstop=async()=>{
   stream.getTracks().forEach(t=>t.stop());recording=false;mic.classList.remove("recording");status.textContent="Transcribing…";
   const ext=(mediaRecorder.mimeType||"audio/mp4").includes("webm")?"webm":"m4a";
   const fd=new FormData();fd.append("audio",new Blob(chunks,{type:mediaRecorder.mimeType||"audio/mp4"}),`astrol.${ext}`);
   try{
    const r=await fetch("/api/transcribe",{method:"POST",body:fd});const d=await r.json();if(!r.ok)throw new Error(d.error);
    if(d.text)await ask(d.text,true);else status.textContent="";
   }catch(e){status.textContent="";toastMsg("I couldn't understand the recording.");console.error(e)}
  };
  mediaRecorder.start();recording=true;mic.classList.add("recording");status.textContent="Listening… tap 🎙️ when finished";
 }catch(e){toastMsg("Please allow microphone access in Safari settings.");console.error(e)}
}
function stopRecording(){if(mediaRecorder&&recording)mediaRecorder.stop()}
mic.onclick=()=>recording?stopRecording():startRecording();

send.onclick=()=>ask(input.value,false);
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask(input.value,false)}});

function setupWake(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;
 wakeRecognition=new SR();wakeRecognition.lang="en-US";wakeRecognition.continuous=true;wakeRecognition.interimResults=false;
 wakeRecognition.onresult=e=>{
  const last=e.results[e.results.length-1][0].transcript.trim();
  if(/^(hey\s+astro|astro)\b/i.test(last)){
   const cleaned=last.replace(/^(hey\s+astro|astro)\b[\s,.!?]*/i,"").trim();
   if(!recording){ if(cleaned) ask(cleaned,true); else {toastMsg("I'm listening 🎙️");startRecording()} }
  }
 };
 wakeRecognition.onend=()=>{if(wakeActive){try{wakeRecognition.start()}catch(e){}}};
}
setupWake();
wake.onchange=()=>{
 wakeActive=wake.checked;
 if(!wakeRecognition){wake.checked=false;toastMsg("Wake-word listening is not supported in this browser.");return}
 if(wakeActive){try{wakeRecognition.start();toastMsg("Astrol is listening for “Hey Astro” while open.");}catch(e){}}
 else wakeRecognition.stop();
};

if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
</script>
</body>
</html>
